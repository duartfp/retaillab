spring.application.name=retaillab-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/retaillab
spring.datasource.username=retaillab
spring.datasource.password=retaillab

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Dev-only secret. Move to an environment variable before deploying anywhere real.
app.jwt.secret=retaillab-dev-secret-key-change-me-before-deploying-anywhere-1234567890
app.jwt.expiration-ms=86400000
